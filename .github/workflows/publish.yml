name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm provenance: lets npm verify this run came from this
  # workflow via Sigstore/OIDC, without a long-lived signing key anywhere.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
