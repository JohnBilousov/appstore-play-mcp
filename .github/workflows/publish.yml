name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  # OIDC token for npm trusted publishing — no NPM_TOKEN secret needed.
  # This also lets npm verify the run came from this exact workflow when
  # signing the --provenance attestation via Sigstore.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0; pin to
          # 24 so the bundled npm is unambiguously new enough.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
